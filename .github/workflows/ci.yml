name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm install
      - name: unit tests
        run: node --test test/
      - name: typecheck harness hook
        run: npm run typecheck
      - name: smoke (offline)
        run: bash examples/smoke-test.sh
