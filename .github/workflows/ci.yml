name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm install
      - name: smoke (backend, offline)
        run: bash examples/smoke-test.sh
      - name: typecheck Pi extension
        run: npm run typecheck
      - name: orchestrates itself (dry-run)
        run: node bin/phase-orchestrate.mjs "ship offline auth" --repo . --dry-run
